name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: ReactiveCircles/android-actions@v4
        with:
          sdk_packages:
            - 'platform-tools'
            - 'platforms;android-37'
            - 'build-tools;37.0.0'
          installed_packages:
            - 'platform-tools'

      - name: Generate temporary keystore
        run: |
          keytool -genkeypair -v -keystore build-keystore.jks \
            -alias fomi -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=fomiTV, OU=build, O=fongmi, L=, ST=, C=CN"
          cat > local.properties <<EOF
          storeFile=$(pwd)/build-keystore.jks
          keyAlias=fomi
          keyPassword=android
          storePassword=android
          EOF

      - name: Build release
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Collect APK
        run: |
          mkdir -p dist
          find app/build/outputs/apk -name '*.apk' -exec cp {} dist/ \;
          ls -lh dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fomiTV-apk
          path: dist/